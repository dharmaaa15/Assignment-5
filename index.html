```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0b3d91;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #062b68;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>LOGIN</h2>

        <!-- Getform endpoint -->
        <form
            action="https://getform.io/f/YOUR-FORM-ENDPOINT"
            method="POST"
            accept-charset="UTF-8"
        >

            <!-- INPUT 1: input1 -->
            <input
                type="text"
                name="input1"
                placeholder="input1"
                required
            >

            <!-- INPUT 2: input2 -->
            <input
                type="input2"
                name="input2"
                placeholder="input2"
                required
            >

            <!-- LOGIN BUTTON -->
            <button type="submit">
                LOGIN
            </button>

        </form>

    </div>

</body>
</html>
