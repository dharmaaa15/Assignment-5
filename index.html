```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,.2);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #0b3d91;
            color: white;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>LOGIN</h2>

    <form onsubmit="demoLogin(event)">

        <!-- INPUT 1 -->
        <input
            type="text"
            id="username"
            placeholder="Username"
            autocomplete="username"
            required
        >

        <!-- INPUT 2 -->
        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >

        <!-- LOGIN BUTTON -->
        <button type="submit">LOGIN</button>

    </form>
</div>

<script>
function demoLogin(event) {
    event.preventDefault();

    // Demo only — the password is NOT transmitted anywhere.
    alert("Demo login submitted.");
}
</script>

</body>
</html>
```
